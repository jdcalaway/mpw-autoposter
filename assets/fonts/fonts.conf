<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Make the bundled Quicksand brand font discoverable to librsvg/sharp,
       on both the local machine and the GitHub Actions runner. -->
  <dir prefix="relative">.</dir>
  <!-- Keep system fonts too, where present (Linux). Ignored on Windows. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
