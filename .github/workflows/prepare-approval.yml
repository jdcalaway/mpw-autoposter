name: Prepare approval

# Daily, ~8am Pacific (15:00 UTC). Builds tomorrow's image and opens the
# approval issue you react to. Also runnable by hand to test.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/creative-policy.mjs'
      - 'scripts/lib/content-policy.mjs'
      - 'scripts/generate-copy.mjs'
      - 'scripts/lib/fresh-copy.mjs'
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: mpw-write
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      # Make the bundled Quicksand brand font discoverable to sharp/librsvg.
      FONTCONFIG_FILE: ${{ github.workspace }}/assets/fonts/fonts.conf
      FONTCONFIG_PATH: ${{ github.workspace }}/assets/fonts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Import Google reviews when connected
        if: vars.GOOGLE_REVIEWS_ENABLED == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_BUSINESS_LOCATION: ${{ vars.GOOGLE_BUSINESS_LOCATION }}
          GOOGLE_REVIEWS_URL: ${{ vars.GOOGLE_REVIEWS_URL }}
        run: node scripts/import-reviews.mjs
      - name: Refresh upcoming concepts and reviews
        run: node scripts/generate-calendar.mjs
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Write original upcoming posts
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-copy.mjs
      - name: Load fresh writing
        run: node scripts/generate-calendar.mjs
      - name: Generate fresh artwork for upcoming posts
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_IMAGES_PAUSED: ${{ vars.AI_IMAGES_PAUSED }}
        run: node scripts/generate-ai-creatives.mjs --generate
      - name: Select newly generated artwork
        run: node scripts/generate-calendar.mjs
      - name: Phase 1 — resolve & commit images
        run: |
          node scripts/prepare.mjs --images-only
          git add -A
          git diff --cached --quiet || git commit -m "Resolve post images [skip ci]"
          git pull --rebase --autostash || true
          git push
      - name: Phase 2 — open approval issues (images now public)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/prepare.mjs --issues-only
          git add -A
          git diff --cached --quiet || git commit -m "Open approval issues [skip ci]"
          git pull --rebase --autostash || true
          git push
