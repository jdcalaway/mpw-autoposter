name: Publish due posts

# Hourly. Publishes approved posts that are due to Facebook + Instagram.
# The scripts respect each post's scheduled time, so hourly granularity is fine.
on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: mpw-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: node scripts/publish.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish status [skip ci]"
          git pull --rebase --autostash || true
          git push
